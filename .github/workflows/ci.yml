name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy

      - name: Check formatting with Black
        run: black --check --diff aegis/ tests/

      - name: Check import sorting with isort
        run: isort --check-only --diff aegis/ tests/

      - name: Lint with Ruff
        run: ruff check aegis/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short --cov=aegis --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mypy

      - name: Run mypy
        run: mypy aegis/ --ignore-missing-imports --no-error-summary || true
        continue-on-error: true

  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test package imports
        run: |
          python -c "from aegis.replay import SumTree, PrioritizedReplayBuffer"
          python -c "from aegis.algorithms import PPOAlgorithm, VMPOAlgorithm"
          python -c "from aegis.core import Trajectory, Batch, Metrics"
          echo "All imports successful!"

      - name: Test SumTree basic operations
        run: |
          python -c "
          from aegis.replay import SumTree
          import numpy as np

          tree = SumTree(1000)
          for i in range(100):
              tree.add(np.random.random())

          rng = np.random.default_rng(42)
          indices, priorities, _ = tree.batch_sample(32, rng)

          assert len(indices) == 32
          assert tree.total() > 0
          print(f'SumTree test passed: {len(tree)} items, total priority {tree.total():.4f}')
          "

      - name: Test Ring Buffer operations
        run: |
          python -c "
          from aegis.replay import RingBuffer, TrajectoryBuffer
          import numpy as np

          buf = RingBuffer(100)
          for i in range(50):
              buf.push(i)

          assert len(buf) == 50
          assert buf.pop() == 0

          traj_buf = TrajectoryBuffer(1000, obs_shape=(4,), action_shape=())
          for i in range(100):
              traj_buf.add(
                  observation=np.ones(4),
                  action=np.array(0),
                  reward=1.0,
                  done=False,
                  log_prob=-0.5,
                  value=0.5,
                  policy_version=0,
              )

          assert len(traj_buf) == 100
          print('Ring buffer tests passed!')
          "
